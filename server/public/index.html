<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><h1>Account</h1><p id="status">เข้าสู่ระบบหรือสร้างบัญชีใหม่</p><section class="forms"><form id="login"><h2>Login</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>เข้าสู่ระบบ</button></form><form id="register"><h2>Register</h2><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><input name="phone" placeholder="Phone (optional)"><input name="password" type="password" minlength="8" placeholder="Password (อย่างน้อย 8 ตัว)" required><button>สร้างบัญชี</button></form></section><button id="logout" hidden>ออกจากระบบ</button></main><script src="/app.js"></script></body></html>
